{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.AppName}} — Admin</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body class="admin-body">
    <nav class="admin-nav">
        <div class="nav-brand">
            <svg class="nav-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>{{.AppName}}</span>
        </div>
        <div class="nav-links">
            <a href="/admin" class="nav-link">Dashboard</a>
            <a href="/admin/codes" class="nav-link">Codes</a>
            <a href="/admin/sessions" class="nav-link">Sessions</a>
            <a href="/admin/audit" class="nav-link">Audit Log</a>
            <a href="/admin/settings" class="nav-link">Settings</a>
        </div>
        <div class="nav-right">
            <span class="nav-user">{{.Session.CodeName}}</span>
            <form method="POST" action="/logout" style="display:inline">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <button type="submit" class="btn btn-ghost btn-sm">Sign out</button>
            </form>
        </div>
    </nav>
    <main class="admin-main">
        {{template "content" .}}
    </main>
</body>
</html>{{end}}
