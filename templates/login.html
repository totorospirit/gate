{{define "login.html"}}<!DOCTYPE html>
<html lang="{{.Messages.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.AppName}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            {{if .LogoURL}}
            <div class="login-logo">
                <img src="{{.LogoURL}}" alt="{{.AppName}}">
            </div>
            {{else}}
            <div class="login-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    <circle cx="12" cy="16" r="1"/>
                </svg>
            </div>
            {{end}}
            <h1 class="login-title">{{.Messages.LoginTitle}}</h1>
            <p class="login-subtitle">{{.Messages.LoginSubtitle}}</p>

            {{if .Error}}
            <div class="login-error" role="alert">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                <span>{{.Error}}</span>
            </div>
            {{end}}

            <form method="POST" action="/login" class="login-form" autocomplete="off">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <input type="hidden" name="redirect" value="{{.Redirect}}">
                <div class="input-group">
                    <input
                        type="password"
                        name="code"
                        placeholder="{{.Messages.CodePlaceholder}}"
                        class="login-input"
                        required
                        autofocus
                        autocomplete="current-password"
                    >
                </div>
                <button type="submit" class="login-button">
                    <span>{{.Messages.LoginButton}}</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </form>
        </div>
        <div class="login-footer">
            <span>{{.Messages.PoweredBy}} {{.AppName}}</span>
        </div>
    </div>
</body>
</html>{{end}}
